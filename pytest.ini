[pytest]
# Desde la raíz, `python -m pytest` corre las pruebas de datos (equipo A) y las de la
# interfaz (equipo C): ambas usan únicamente la biblioteca estándar. Las del núcleo de IA
# necesitan sus dependencias y se corren aparte:
#   cd backend && python -m pytest
testpaths = tests interfaz/tests
norecursedirs = backend datos .git .venv
